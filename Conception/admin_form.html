<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Ajouter un article</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap'); *{font-family:'Poppins',sans-serif;} body{background:linear-gradient(135deg,#e0f2fe 0%,#bae6fd 50%,#a7f3d0 100%);} </style>
</head>
<body>
    <div class="flex min-h-screen">
        <!-- Sidebar (simple copy) -->
        <aside class="w-64 bg-white shadow-lg">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-800">Chefchaouen</h2>
                <p class="text-sm text-gray-600">Bleu Durable - Admin</p>
            </div>
            <nav class="space-y-2 p-4">
                <a href="admin_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-700"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a>
                <a href="admin_articles.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-sky-100 text-sky-700 font-semibold"><i class="fas fa-newspaper"></i> Articles</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-700"><i class="fas fa-comments"></i> Commentaires</a>
                <a href="admin_login.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-700"><i class="fas fa-sign-out-alt"></i> Se déconnecter</a>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            <div class="max-w-3xl mx-auto">
                <header class="mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Ajouter un article</h1>
                    <p class="text-gray-600 mt-1">Remplissez le formulaire pour ajouter un article .</p>
                </header>

                <form id="addArticleForm" action="admin_articles.html" method="get" class="bg-white rounded-lg shadow p-6">
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="text-sm font-medium text-gray-700">Titre</label>
                            <input id="title" required class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-3" placeholder="Titre de l'article">
                        </div>

                        <div>
                            <label class="text-sm font-medium text-gray-700">Excrept</label>
                            <textarea id="content" required rows="6" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-3" placeholder="Excrept de l'article..."></textarea>
                        </div>

                        <div>
                            <label class="text-sm font-medium text-gray-700">Contenu</label>
                            <textarea id="content" required rows="6" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-3" placeholder="Contenu de l'article..."></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="text-sm font-medium text-gray-700">Image (URL)</label>
                                <input id="imageUrl" type="url" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-3" placeholder="https://..." />
                            </div>

                            <div>
                                <label class="text-sm font-medium text-gray-700">Date de création</label>
                                <input id="date" type="date" required class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-3" />
                            </div>
                        </div>

                        <div>
                            <label class="text-sm font-medium text-gray-700">Tag</label>
                            <select id="tag" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-3">
                                <option value="Nature">Nature</option>
                                <option value="Artisanat">Artisanat</option>
                                <option value="Gastronomie">Gastronomie</option>
                                <option value="Histoire">Histoire</option>
                                <option value="Aventure">Aventure</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-700">Status</label>
                            <select id="tag" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-3">
                                <option value="Nature">En attente</option>
                                <option value="Artisanat">Validé</option>
                            </select>
                        </div>

                        <div class="flex items-center justify-between pt-4">
                            <a href="admin_articles.html" class="text-sm text-gray-600">Retour à la liste</a>
                            <button type="submit" class="bg-gradient-to-r from-blue-500 to-teal-400 text-white px-6 py-2 rounded-md font-medium">Ajouter l'article</button>
                        </div>
                    </div>
                </form>

                <div id="msg" class="mt-4 text-sm text-green-600"></div>
            </div>
        </main>
    </div>
</body>
</html>
