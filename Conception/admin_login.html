<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Connexion | Chefchaouen Bleu Durable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #a7f3d0 0%, #bfdbfe 50%, #e0f2fe 100%); }
        .glass { background: rgba(255,255,255,0.6); backdrop-filter: blur(8px); }
        .input-focus:focus { outline: none; box-shadow: 0 8px 30px rgba(14,165,233,0.15); border-color: #06b6d4; }
    </style>
</head>
<body class="flex items-center justify-center p-6">
    <div class="w-full max-w-md mx-auto">
        <div class="glass rounded-3xl shadow-2xl p-10 border border-white/40">
            <div class="text-center mb-6">
                <div class="inline-block bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-full px-4 py-2 mb-4 shadow-lg">
                    <i class="fas fa-shield-alt mr-2"></i>Administration
                </div>
                <h1 class="text-3xl font-extrabold text-gray-800">Connexion Admin</h1>
                <p class="text-gray-600 mt-2">Accédez au tableau de bord</p>
            </div>

            <form action="admin_dashboard.html" method="GET" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email ou nom d'utilisateur</label>
                    <input name="username" type="text" required placeholder="admin@exemple.com" class="w-full px-5 py-3 rounded-2xl border-2 border-white/50 focus:border-sky-400 input-focus bg-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
                    <input name="password" type="password" required placeholder="••••••••" class="w-full px-5 py-3 rounded-2xl border-2 border-white/50 focus:border-sky-400 input-focus bg-white">
                </div>

                <div class="flex items-center justify-between">
                    <div class="text-sm">
                        <a href="admin_reset.html" class="text-sky-600 hover:underline">Mot de passe oublié ?</a>
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full btn-chefchaouen relative px-6 py-3 rounded-full text-white font-bold text-lg shadow-xl">
                        <span class="relative z-10"><i class="fas fa-right-to-bracket mr-2"></i>Se connecter</span>
                    </button>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
